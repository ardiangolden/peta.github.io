// =====================================================================================

// ================= MAP =================
var map = L.map('map');

L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{
  maxZoom:20,
  subdomains:['mt0','mt1','mt2','mt3']
}).addTo(map);

// ================= STYLE =================
function styleBidang(){
  return { color:'red', weight:2, fillOpacity:0.35 };
}

// ================= LAYER =================
var bidangLayer = L.geoJSON(dataBidang,{
  style: styleBidang,
  onEachFeature:function(feature, layer){

    var luas = turf.area(feature);

    layer.bindPopup(`
      <b>Pemohon:</b> ${feature.properties.Pemohon || '-'}<br>
      <b>NIB:</b> ${feature.properties.NIB || '-'}<br>
      <b>Luas Digitasi:</b> ${luas.toFixed(0)} m²
    `);

    // ===== LABEL =====
    var center = layer.getBounds().getCenter();
    var label = L.marker(center,{
      icon: L.divIcon({
        className:'label-pemohon',
        html: feature.properties.Pemohon || '',
        iconSize:[120,20]
      })
    });

    layer.on('add', function(){
      if(map.getZoom() >= 17){ label.addTo(map); }
    });

    layer.on('remove', function(){
      map.removeLayer(label);
    });

    map.on('zoomend', function(){
      if(map.hasLayer(layer)){
        if(map.getZoom() < 17){
          map.removeLayer(label);
        } else {
          label.addTo(map);
        }
      }
    });
  }
}).addTo(map);

map.fitBounds(bidangLayer.getBounds());

// ================= SEARCH =================
function searchPemohon(){
  var key = document.getElementById('pemohonInput').value.toLowerCase();
  var found = false;

  bidangLayer.eachLayer(function(layer){
    var p = layer.feature.properties.Pemohon;
    if(p && p.toLowerCase().includes(key)){
      map.fitBounds(layer.getBounds());
      layer.setStyle({color:'blue',weight:3});
      layer.openPopup();
      found = true;
    } else {
      layer.setStyle({color:'red',weight:2});
    }
  });

  if(!found){ alert('Pemohon tidak ditemukan'); }
}

// ================= LEGENDA =================
var legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  var div = L.DomUtil.create('div','legend');
  div.innerHTML = `<b>Legenda</b><br><i></i> Bidang Tanah`;
  return div;
};
legend.addTo(map);

// ================= SCALE =================
L.control.scale({
  metric:true,
  imperial:false,
  position:'bottomleft'
}).addTo(map);

// ================= COMPASS =================
map.addControl(new L.Control.Compass({autoActive:true}));

// ================= PRINT =================
L.easyPrint({
  title:'Cetak Peta',
  position:'topleft',
  sizeModes:['A4Portrait','A4Landscape','A3Portrait','A3Landscape'],
  exportOnly:true
}).addTo(map);

map.on('easyPrint-start', function(){
  map.setZoom(18);
});
</script>
